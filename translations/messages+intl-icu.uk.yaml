'{name} - Lemmy redirect service': '{name} — Lemmy-переспрямування'
'This service is used for linking to Lemmy communities, users, posts etc. in a universal way.': 'Посилайтесь на спільноти, користувачів і дописи з Lemmy універсальним чином.'
'When you use this service, you give your users the option to view a community or a user profile on their preferred instance instead of going through a complicated process just to interact with the link.': 'Користувачі можуть переглядати спільноти й користувацькі профілі на своєму улюбленому сервері — жодних складних процесів, щоб просто скористатися посиланням.'
'How it works without this service:': 'Що доводиться робити без цієї служби:'
"You link to a community (user, post), let's say <strong>{example}</strong>, using a link:": 'Ви посилаєтесь на спільноту (користувача, допис), як-от <strong>{example}</strong>, за адресою:'
'After the user clicks it, one of two things happens:': 'Коли користувачі переходять за нею, є два варіанти:'
"They have an account on the same instance which means everything is fine and the link works, you're done.": 'У них є обліковка на тому ж сервері, тобто все гаразд і посилання працює без додаткових зусиль.'
"The user doesn't have an account on the same instance, so the process gets more complicated.": 'Користувача зареєстровано на іншому сервері, тож процес ускладнюється.'
'The user has to open their own instance.': 'Користувач відкриває свій сервер.'
'The user has to copy the link.': 'Користувач копіює посилання.'
'The user has to paste the link into a search bar on their own instance.': 'Користувач вставляє посилання в пошук на своєму сервері.'
'The user has to click the link in search results.': 'Користувач натискає результат у пошуковій видачі.'
'How it works with this service:': 'А з цією службою — простіше:'
'You link to the same community like this:': 'Ви посилаєтесь на ту саму спільноту за адресою:'
"If this isn't the first time the user is here, they will be redirected to their preferred instance.": 'Користувачі, які вже тут були, переспрямовуються на свій улюблений сервер.'
'If this is the first time, the user is given the option to either set their own instance or to continue to the target instance.': 'Новий користувач отримує змогу вказати свій сервер або перейти на цільовий.'
"Done! Either way the user is on an instance, either one of their choice or on the one the community is hosted on if the user doesn't care.": 'І все! В будь-якому разі користувач опиняється на сервері — або на вибраному самостійно, або (якщо йому байдуже) на сервері, де розміщено спільноту.'
